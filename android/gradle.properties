# Bu makinede ayni anda birden fazla Gradle derlemesi emulatorlerin yaninda calisabiliyor;
# yigin sinirlari bu yuzden bilerek dusuk tutuldu.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
org.gradle.caching=true
# externalNativeBuild (ndkBuild) ve dist gorevi ile denendi, calisiyor.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
